<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Créer un professeur</title>
  <style>
    body{font-family: Arial, Helvetica, sans-serif;max-width:720px;margin:2rem auto;padding:1rem}
    label{display:block;margin-top:0.5rem}
    input{padding:0.4rem;width:100%;box-sizing:border-box}
    button{margin-top:0.8rem;padding:0.6rem 1rem}
    pre{background:#f5f5f5;padding:1rem}
  </style>
</head>
<body>
  <h1>Créer un professeur</h1>

  <form id="createForm">
    <label for="nom">Nom</label>
    <input id="nom" name="nom" required />

    <label for="prenom">Prénom</label>
    <input id="prenom" name="prenom" required />

    <button type="submit">Créer</button>
  </form>

  <div id="result" aria-live="polite" style="margin-top:1rem"></div>

  <hr />
  <h2>Liste des professeurs</h2>
  <button id="refresh">Rafraîchir la liste</button>
  <pre id="list"></pre>

  <script>
    // Utiliser l'origine actuelle pour éviter les problèmes de CORS (localhost vs 127.0.0.1)
    const API = window.location.origin;

    // Auth: bannière et vérification d'accès
    (function(){
        function getAuthUser(){ try{ return JSON.parse(localStorage.getItem('authUser')||'null'); }catch(e){return null;} }
        const user = getAuthUser();
        const banner = document.createElement('div');
        banner.id = 'auth-banner';
        banner.style = 'text-align:right;margin-bottom:12px;color:#1976d2;font-weight:700;';
        if(user){
            banner.innerHTML = 'Connecté en tant que : ' + (user.displayName || user.username) + ' <button id="logoutBtn" style="margin-left:8px;padding:4px 8px;border-radius:4px;border:1px solid #ccc;background:#fff;cursor:pointer">Déconnexion</button>';
        } else {
            banner.innerHTML = '<a href="/connexion" style="color:#1976d2;text-decoration:underline">Se connecter</a>';
        }
        document.body.insertBefore(banner, document.body.firstChild);
        if(user){ document.getElementById('logoutBtn').addEventListener('click', function(){ localStorage.removeItem('authUser'); location.reload(); }); }
        if(!user){ window.location.href = '/planning_modern'; }
    })();

    const form = document.getElementById('createForm');
    const result = document.getElementById('result');
    const listPre = document.getElementById('list');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.textContent = 'Envoi...';
      const payload = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value
      };

      try {
        const res = await fetch(API + '/addProf', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        result.textContent = JSON.stringify(json, null, 2);
        form.reset();
        loadList();
      } catch (err) {
        result.textContent = 'Erreur: ' + err.message;
      }
    });

    async function loadList(){
      listPre.textContent = 'Chargement...';
      try{
        const r = await fetch(API + '/getListProfs');
        const j = await r.json();
        listPre.textContent = JSON.stringify(j, null, 2);
      }catch(e){
        listPre.textContent = 'Impossible de récupérer la liste: ' + e.message;
      }
    }

    document.getElementById('refresh').addEventListener('click', loadList);
    // charge au démarrage
    loadList();
  </script>
</body>
</html>
