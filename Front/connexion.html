<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 0; }
        .container { max-width: 420px; margin: 60px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 28px; }
        h1 { text-align: center; color: #1976d2; margin-bottom: 18px; }
        label { display:block; margin-top:10px; font-weight:700; color:#1976d2 }
        input { width:100%; padding:10px; margin-top:6px; border-radius:6px; border:1px solid #cfd8dc }
        button { margin-top:18px; width:100%; padding:10px; border-radius:6px; background:#1976d2; color:#fff; border:none; font-weight:700 }
        .note { margin-top:12px; font-size:0.95em; color:#666 }
        .result { margin-top:12px; font-weight:700 }
    </style>
</head>
<body>
    <div class="container">
        <h1>Connexion</h1>
        <form id="loginForm">
            <label for="username">Email ou nom d'utilisateur</label>
            <input id="username" name="username" autocomplete="username" />
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
            <button type="submit">Se connecter</button>
        </form>

        <div style="text-align:center;margin-top:12px">
            <small>Pas de compte ? <a href="#" id="showRegister">Créer un compte</a></small>
        </div>

        <form id="registerForm" style="display:none;margin-top:14px">
            <h3 style="margin-top:0">Créer un compte</h3>
            <label for="reg_email">Email</label>
            <input id="reg_email" name="reg_email" />
            <label for="reg_password">Mot de passe</label>
            <input id="reg_password" name="reg_password" type="password" />
            <label for="reg_password2">Confirmer le mot de passe</label>
            <input id="reg_password2" name="reg_password2" type="password" />
            <button type="submit">Créer le compte</button>
        </form>

        <div class="result" id="result" aria-live="polite"></div>
        <div class="note">Remarque : authentification simple (pas de cryptage). Vous pouvez utiliser <strong>user/user</strong> ou <strong>admin/admin</strong> comme comptes de test, ou créer un compte via le formulaire ci-dessus.</div>
        <p style="margin-top:14px"><a href="/">← Retour menu</a></p>
    </div>
    <script>
        const API = window.location.origin;

        function getAuthUser(){ try{ return JSON.parse(localStorage.getItem('authUser')||'null'); }catch(e){return null;} }

        const existing = getAuthUser();
        const result = document.getElementById('result');
        if (existing) {
            result.textContent = 'Vous êtes déjà connecté en tant que : ' + (existing.displayName || existing.username);
        }

        // Login via backend /login
        document.getElementById('loginForm').addEventListener('submit', async function(e){
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            result.style.color = 'black';
            result.textContent = 'Connexion...';
            try{
                const res = await fetch(API + '/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: u, password: p }) });
                if (!res.ok) {
                    const err = await res.json().catch(()=>({detail:'Erreur'}));
                    throw new Error(err.detail || 'Identifiants invalides');
                }
                const j = await res.json();
                localStorage.setItem('authUser', JSON.stringify({ username: j.username, displayName: j.displayName }));
                result.style.color = 'green';
                result.textContent = 'Connecté en tant que : ' + (j.displayName || j.username) + '. Redirection...';
                setTimeout(() => { window.location.href = '/'; }, 800);
            }catch(err){ result.style.color='red'; result.textContent = 'Erreur: ' + err.message; }
        });

        // Afficher le formulaire d'inscription
        document.getElementById('showRegister').addEventListener('click', function(e){ e.preventDefault(); document.getElementById('registerForm').style.display = ''; this.style.display = 'none'; });

        // Inscription -> POST /addUser
        document.getElementById('registerForm').addEventListener('submit', async function(e){
            e.preventDefault();
            const email = document.getElementById('reg_email').value.trim();
            const pw = document.getElementById('reg_password').value;
            const pw2 = document.getElementById('reg_password2').value;
            if (!email || !pw) { result.style.color='red'; result.textContent='Veuillez fournir email et mot de passe.'; return; }
            if (pw !== pw2) { result.style.color='red'; result.textContent='Les mots de passe ne correspondent pas.'; return; }
            result.style.color='black'; result.textContent='Création en cours...';
            try{
                const res = await fetch(API + '/addUser', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: email, password: pw, admin: false }) });
                if (!res.ok) {
                    const err = await res.json().catch(()=>({detail:'Erreur création'}));
                    throw new Error(err.detail || 'Erreur création');
                }
                const j = await res.json();
                // auto-login simple
                localStorage.setItem('authUser', JSON.stringify({ username: j.email, displayName: j.email }));
                result.style.color='green'; result.textContent='Compte créé et connecté : ' + j.email + '. Redirection...';
                setTimeout(()=>{ window.location.href = '/'; }, 900);
            }catch(err){ result.style.color='red'; result.textContent='Erreur: ' + err.message; }
        });
    </script>
</body>
</html>
