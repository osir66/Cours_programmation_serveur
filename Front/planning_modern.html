<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emploi du temps - Promotions</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 32px 24px 24px 24px;
        }
        h1 {
            text-align: center;
            color: #2d3a4b;
            margin-bottom: 24px;
        }
        .filters {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        select, button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #cfd8dc;
            font-size: 16px;
        }
        button {
            background: #1976d2;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #125ea7;
        }
        .calendar {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        .calendar th, .calendar td {
            border: 1px solid #e0e0e0;
            padding: 12px 6px;
            text-align: center;
        }
        .calendar th {
            background: #e3eaf2;
            color: #2d3a4b;
        }
        .event {
            border-radius: 6px;
            padding: 6px 4px;
            color: #fff;
            font-size: 15px;
            margin: 2px 0;
            font-weight: 500;
        }
        .matiere-1 { background: #42a5f5; }
        .matiere-2 { background: #66bb6a; }
        .matiere-3 { background: #ffa726; }
        .matiere-4 { background: #ab47bc; }
        .matiere-5 { background: #ef5350; }
        .matiere-6 { background: #26c6da; }
        .matiere-7 { background: #8d6e63; }
        @media (max-width: 700px) {
            .container { padding: 8px; }
            .calendar th, .calendar td { padding: 4px 2px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emploi du temps par promotion</h1>
        <a href="/" style="display:inline-block;margin-bottom:18px;color:#1976d2;text-decoration:underline;font-size:15px">← Retour menu</a>
        <div class="filters">
            <label for="promo-select">Promotion :</label>
            <select id="promo-select"></select>
            <button id="refresh">Rafraîchir</button>
        </div>
        <div id="calendar-container">
            <em>Veuillez choisir une promotion pour afficher l'emploi du temps.</em>
        </div>
    </div>
    <script>
        const API = window.location.origin;

        // Affiche la bannière d'authentification (si connecté)
        (function(){
            function getAuthUser(){ try{ return JSON.parse(localStorage.getItem('authUser')||'null'); }catch(e){return null;} }
            const user = getAuthUser();
            const container = document.querySelector('.container');
            const banner = document.createElement('div');
            banner.id = 'auth-banner';
            banner.style = 'text-align:right;margin-bottom:12px;color:#1976d2;font-weight:700;';
            if(user){
                banner.innerHTML = 'Connecté en tant que : ' + (user.displayName || user.username) + ' <button id="logoutBtn" style="margin-left:8px;padding:4px 8px;border-radius:4px;border:1px solid #ccc;background:#fff;cursor:pointer">Déconnexion</button>';
            } else {
                banner.innerHTML = '<a href="/connexion" style="color:#1976d2;text-decoration:underline">Se connecter</a>';
            }
            container.insertBefore(banner, container.firstChild);
            if(user){ document.getElementById('logoutBtn').addEventListener('click', function(){ localStorage.removeItem('authUser'); location.reload(); }); }
        })();

        // Utilitaires pour les couleurs de matières
        function matiereColorIdx(matiere) {
            // Simple hash pour attribuer une couleur
            let sum = 0;
            for (let i = 0; i < matiere.length; i++) sum += matiere.charCodeAt(i);
            return (sum % 7) + 1;
        }

        // Charger la liste des promotions
        async function loadPromos() {
            const select = document.getElementById('promo-select');
            select.innerHTML = '<option>Chargement...</option>';
            try {
                const res = await fetch(API + '/promotions/getListPromotions');
                const promos = await res.json();
                select.innerHTML = '';
                promos.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.nom_promotion || ('Promo ' + p.id);
                    select.appendChild(opt);
                });
            } catch (e) {
                select.innerHTML = '<option>Erreur chargement</option>';
            }
        }

        // Charger et afficher l'emploi du temps pour une promo
        async function loadPlanning(promoId) {
            const container = document.getElementById('calendar-container');
            container.innerHTML = '<em>Chargement...</em>';
            try {
                const res = await fetch(API + '/cours/getListCours');
                const allCours = await res.json();
                const cours = Array.isArray(allCours) ? allCours.filter(c => String(c.id_promo) === String(promoId)) : [];
                if (!cours.length) {
                    container.innerHTML = '<p>Aucun cours pour cette promotion.</p>';
                    return;
                }
                // Générer la grille semaine (lundi-dimanche, 8h-20h)
                const days = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
                let hours = [];
                for (let h = 8; h <= 20; h++) hours.push(h);
                let table = '<table class="calendar"><tr><th>Heure</th>';
                days.forEach(d => table += `<th>${d}</th>`);
                table += '</tr>';
                hours.forEach(hour => {
                    table += `<tr><th>${hour}h</th>`;
                    for (let d = 0; d < 7; d++) {
                        // Chercher les cours à cet horaire/jour
                        const coursHere = cours.filter(c => {
                            const date = new Date(c.date_debut);
                            return date.getDay() === ((d+1)%7) && date.getHours() === hour;
                        });
                        if (coursHere.length) {
                            table += '<td>';
                            coursHere.forEach(c => {
                                const colorIdx = matiereColorIdx(c.matiere);
                                table += `<div class="event matiere-${colorIdx}">${c.matiere}<br><span style='font-size:12px'>${c.date_debut.slice(11,16)}-${c.date_fin.slice(11,16)}<br>${c.nom_prof || 'Prof ' + c.id_prof}<br>${c.nom_salle || 'Salle ' + c.id_salle}</span></div>`;
                            });
                            table += '</td>';
                        } else {
                            table += '<td></td>';
                        }
                    }
                    table += '</tr>';
                });
                table += '</table>';
                container.innerHTML = table;
            } catch (e) {
                container.innerHTML = '<span style="color:red">Erreur lors du chargement du planning.</span>';
            }
        }

        document.getElementById('refresh').addEventListener('click', () => {
            const promoId = document.getElementById('promo-select').value;
            if (promoId) loadPlanning(promoId);
        });
        document.getElementById('promo-select').addEventListener('change', e => {
            if (e.target.value) loadPlanning(e.target.value);
        });
        loadPromos();
    </script>
</body>
</html>
