<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emploi du temps - Promotions</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 32px 24px 24px 24px;
        }
        h1 {
            text-align: center;
            color: #2d3a4b;
            margin-bottom: 24px;
        }
        .filters {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        select, button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #cfd8dc;
            font-size: 16px;
        }
        button {
            background: #1976d2;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #125ea7;
        }
        
        /* Grille de l'emploi du temps */
        .calendar-wrapper {
            position: relative;
            overflow-x: auto;
        }
        .calendar {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 800px;
        }
        .calendar th, .calendar td {
            border: 1px solid #e0e0e0;
            height: 60px; /* 1 heure = 60px */
            text-align: center;
            position: relative;
            padding: 0;
        }
        .calendar th {
            background: #e3eaf2;
            color: #2d3a4b;
            font-size: 14px;
        }
        .hour-col {
            width: 80px;
            background: #f8f9fa;
            font-weight: bold;
        }

        /* Bloc de cours fluide */
        .event-node {
            position: absolute;
            left: 2px;
            right: 2px;
            z-index: 10;
            border-radius: 6px;
            color: #fff;
            padding: 6px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
            line-height: 1.2;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Couleurs matières */
        .matiere-1 { background: #42a5f5; }
        .matiere-2 { background: #66bb6a; }
        .matiere-3 { background: #ffa726; }
        .matiere-4 { background: #ab47bc; }
        .matiere-5 { background: #ef5350; }
        .matiere-6 { background: #26c6da; }
        .matiere-7 { background: #8d6e63; }

        @media (max-width: 700px) {
            .container { padding: 8px; }
            .calendar th, .calendar td { height: 50px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="auth-banner" style="text-align:right;margin-bottom:12px;color:#1976d2;font-weight:700;"></div>
        
        <h1>Emploi du temps par promotion</h1>
        
        <a href="/" style="display:inline-block;margin-bottom:18px;color:#1976d2;text-decoration:underline;font-size:15px">← Retour menu</a>
        
        <div class="filters">
            <label for="promo-select">Promotion :</label>
            <select id="promo-select"><option value="">Chargement...</option></select>
            <button id="refresh">Rafraîchir</button>
        </div>

        <div id="calendar-container" class="calendar-wrapper">
            <p style="text-align:center; padding: 20px;"><em>Veuillez choisir une promotion pour afficher l'emploi du temps.</em></p>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        // Gestion de l'authentification
        (function(){
            const user = JSON.parse(localStorage.getItem('authUser')||'null');
            const banner = document.getElementById('auth-banner');
            if(user){
                banner.innerHTML = 'Connecté en tant que : ' + (user.displayName || user.username) + ' <button id="logoutBtn" style="margin-left:8px;padding:4px 8px;border-radius:4px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:12px;color:#333">Déconnexion</button>';
                document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('authUser'); location.reload(); };
            } else {
                banner.innerHTML = '<a href="/connexion" style="color:#1976d2;text-decoration:underline">Se connecter</a>';
            }
        })();

        function matiereColorIdx(matiere) {
            let sum = 0;
            for (let i = 0; i < matiere.length; i++) sum += matiere.charCodeAt(i);
            return (sum % 7) + 1;
        }

        function startOfWeek(d) {
            const date = new Date(d);
            const day = date.getDay(); // 0 (Sun) .. 6 (Sat)
            const diff = (day + 6) % 7; // days since Monday
            date.setDate(date.getDate() - diff);
            date.setHours(0,0,0,0);
            return date;
        }

        function addDays(d, n) {
            const dt = new Date(d);
            dt.setDate(dt.getDate() + n);
            return dt;
        }

        function formatDateLabel(d) {
            return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
        }

        // current week (Monday)
        let currentWeekStart = startOfWeek(new Date());

        // Charger la liste des promos
        async function loadPromos() {
            const select = document.getElementById('promo-select');
            try {
                const res = await fetch(API + '/promotions/getListPromotions');
                const promos = await res.json();
                select.innerHTML = '<option value="">-- Sélectionner une promotion --</option>';
                promos.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.nom_promotion || ('Promo ' + p.id);
                    select.appendChild(opt);
                });
            } catch (e) {
                select.innerHTML = '<option>Erreur chargement</option>';
            }
        }

        // Charger le planning
        async function loadPlanning(promoId) {
            const container = document.getElementById('calendar-container');
            container.innerHTML = '<p style="text-align:center; padding: 20px;"><em>Chargement...</em></p>';
            
            try {
                const res = await fetch(API + '/cours/getListCours');
                const allCours = await res.json();
                const coursAll = Array.isArray(allCours) ? allCours.filter(c => String(c.id_promo) === String(promoId)) : [];

                // Création de la grille hebdomadaire avec navigation
                const days = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
                const weekStart = currentWeekStart;
                const weekEnd = addDays(weekStart, 6);

                let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
                html += '<div>';
                html += '<button id="prevWeek" style="margin-right:6px;padding:6px 10px;border-radius:6px;border:1px solid #cfd8dc;background:#fff;color:#1976d2;cursor:pointer">‹</button>';
                html += '<button id="todayWeek" style="margin-right:6px;padding:6px 10px;border-radius:6px;border:1px solid #cfd8dc;background:#fff;cursor:pointer">Aujourd\'hui</button>';
                html += '<button id="nextWeek" style="padding:6px 10px;border-radius:6px;border:1px solid #cfd8dc;background:#fff;color:#1976d2;cursor:pointer">›</button>';
                html += '</div>';
                html += `<div style="font-weight:700;color:#1976d2" id="weekLabel">Semaine : ${formatDateLabel(weekStart)} - ${formatDateLabel(weekEnd)}</div>`;
                html += '<div style="color:#1976d2"></div>';
                html += '</div>';

                html += '<table class="calendar"><thead><tr><th class="hour-col">Heure</th>';
                days.forEach((d, idx) => {
                    const date = addDays(weekStart, idx);
                    html += `<th>${d}<div style="font-size:12px;color:#445">${formatDateLabel(date)}</div></th>`;
                });
                html += '</tr></thead><tbody>';

                // Génère les lignes pour 8h à 17h (inclus)
                for (let h = 8; h <= 17; h++) {
                    let label = (h === 8) ? '08:15' : (h === 17) ? '17:15' : `${h}h`;
                    html += `<tr><th class="hour-col">${label}</th>`;
                    for (let d = 0; d < 7; d++) {
                        html += `<td id="cell-${d}-${h}"></td>`;
                    }
                    html += '</tr>';
                }
                html += '</tbody></table>';
                container.innerHTML = html;

                // navigation
                document.getElementById('prevWeek').addEventListener('click', () => { currentWeekStart = addDays(currentWeekStart, -7); if (document.getElementById('promo-select').value) loadPlanning(document.getElementById('promo-select').value); else loadPlanning(promoId); });
                document.getElementById('nextWeek').addEventListener('click', () => { currentWeekStart = addDays(currentWeekStart, 7); if (document.getElementById('promo-select').value) loadPlanning(document.getElementById('promo-select').value); else loadPlanning(promoId); });
                document.getElementById('todayWeek').addEventListener('click', () => { currentWeekStart = startOfWeek(new Date()); if (document.getElementById('promo-select').value) loadPlanning(document.getElementById('promo-select').value); else loadPlanning(promoId); });

                // Filtrer les cours pour la semaine affichée
                const weekStartDate = new Date(weekStart);
                weekStartDate.setHours(0,0,0,0);
                const weekEndDate = addDays(weekStartDate, 7); // exclusif

                const cours = coursAll.filter(c => {
                    const s = new Date(c.date_debut);
                    return s >= weekStartDate && s < weekEndDate;
                });

                // Placement des cours: on clip les cours à la fenêtre 08:15 - 17:15
                cours.forEach(c => {
                    const start = new Date(c.date_debut);
                    const end = new Date(c.date_fin);

                    // Fenêtre visible pour le jour du cours
                    const windowStart = new Date(start.getFullYear(), start.getMonth(), start.getDate(), 8, 15, 0, 0);
                    const windowEnd = new Date(start.getFullYear(), start.getMonth(), start.getDate(), 17, 15, 0, 0);

                    // Si pas de recouvrement, on ignore
                    if (end <= windowStart || start >= windowEnd) return;

                    const visStart = start < windowStart ? windowStart : start;
                    const visEnd = end > windowEnd ? windowEnd : end;

                    if (visEnd <= visStart) return;

                    // Trouver l'index du jour dans la semaine (0 = lundi)
                    const dayIdx = Math.floor((visStart - weekStartDate) / (1000 * 60 * 60 * 24));
                    if (dayIdx < 0 || dayIdx > 6) return;
                    const startHour = visStart.getHours();

                    // Si la cellule n'existe pas (sécurité), on tente d'utiliser la cellule la plus proche
                    let cell = document.getElementById(`cell-${dayIdx}-${startHour}`);
                    if (!cell) {
                        // tenter heure -1 ou +1 pour couvrir bords
                        cell = document.getElementById(`cell-${dayIdx}-${startHour - 1}`) || document.getElementById(`cell-${dayIdx}-${startHour + 1}`);
                    }
                    if (cell) {
                        const durationMin = (visEnd - visStart) / (1000 * 60);
                        const startMin = visStart.getMinutes();
                        const colorIdx = matiereColorIdx(c.matiere);

                        const div = document.createElement('div');
                        div.className = `event-node matiere-${colorIdx}`;

                        // 1 minute = 1px de hauteur (car cell height = 60px)
                        div.style.top = `${startMin}px`;
                        div.style.height = `${durationMin}px`;

                        div.innerHTML = `
                            <strong>${c.matiere}</strong><br>
                            <span style="font-size:11px">${c.date_debut.slice(11,16)} - ${c.date_fin.slice(11,16)}</span><br>
                            <span style="font-size:11px; opacity:0.9">${c.nom_prof || 'Prof '+c.id_prof}<br>${c.nom_salle || 'Salle '+c.id_salle}</span>
                        `;
                        cell.appendChild(div);
                    }
                });

            } catch (e) {
                container.innerHTML = '<p style="text-align:center; color:red;">Erreur lors du chargement.</p>';
            }
        }

        // Événements
        document.getElementById('refresh').addEventListener('click', () => {
            const val = document.getElementById('promo-select').value;
            if(val) loadPlanning(val);
        });
        document.getElementById('promo-select').addEventListener('change', (e) => {
            if(e.target.value) loadPlanning(e.target.value);
        });

        loadPromos();
    </script>
</body>
</html>
