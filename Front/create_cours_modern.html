<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un cours (moderne)</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 32px 24px 24px 24px;
        }
        h1 {
            text-align: center;
            color: #2d3a4b;
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-top: 1.2rem;
            font-weight: 700;
            color: #1976d2;
        }
        input, select {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #cfd8dc;
            margin-top: 0.3rem;
            font-size: 16px;
        }
        button {
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #125ea7; }
        .result {
            margin-top: 1.5rem;
            font-weight: bold;
            min-height: 1.5em;
        }
        .list-cours {
            margin-top: 2.5rem;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 1rem;
            font-size: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .cours-card {
            background: #e3eaf2;
            border-radius: 6px;
            margin-bottom: 10px;
            padding: 10px 12px;
        }
        .cours-card strong { color: #1976d2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Créer un cours</h1>
        <a href="/" style="display:inline-block;margin-bottom:18px;color:#1976d2;text-decoration:underline;font-size:15px">← Retour menu</a>
        <form id="createForm">
            <label for="matiere">Matière</label>
            <input id="matiere" name="matiere" type="text" required />

            <label for="date_debut">Date de début</label>
            <input id="date_debut" name="date_debut" type="datetime-local" required />

            <label for="date_fin">Date de fin</label>
            <input id="date_fin" name="date_fin" type="datetime-local" required />

            <!-- Champ caché et optionnel pour durée totale -->
            <input id="duree_total" name="duree_total" type="hidden" />

            <label for="id_prof">Professeur</label>
            <select id="id_prof" name="id_prof"></select>

            <label for="id_salle">Salle</label>
            <select id="id_salle" name="id_salle"></select>

            <label for="id_promo">Promotion</label>
            <select id="id_promo" name="id_promo"></select>

            <button type="submit">Créer le cours</button>
        </form>
        <div class="result" id="result" aria-live="polite"></div>
        <div class="list-cours" id="list-cours"></div>
    </div>
    <script>
        const API = window.location.origin;

        // Auth: bannière et vérification d'accès
        (function(){
            function getAuthUser(){ try{ return JSON.parse(localStorage.getItem('authUser')||'null'); }catch(e){return null;} }
            const user = getAuthUser();
            const container = document.querySelector('.container');
            const banner = document.createElement('div');
            banner.id = 'auth-banner';
            banner.style = 'text-align:right;margin-bottom:12px;color:#1976d2;font-weight:700;';
            if(user){
                banner.innerHTML = 'Connecté en tant que : ' + (user.displayName || user.username) + ' <button id="logoutBtn" style="margin-left:8px;padding:4px 8px;border-radius:4px;border:1px solid #ccc;background:#fff;cursor:pointer">Déconnexion</button>';
            } else {
                banner.innerHTML = '<a href="/connexion" style="color:#1976d2;text-decoration:underline">Se connecter</a>';
            }
            container.insertBefore(banner, container.firstChild);
            if(user){
                document.getElementById('logoutBtn').addEventListener('click', function(){ localStorage.removeItem('authUser'); location.reload();});
            } else {
                // pas connecté : rediriger vers le planning (seul visible)
                window.location.href = '/planning_modern';
            }
        })();

        // Remplir les listes déroulantes dynamiquement
        async function fillSelect(id, url, labelFn) {
            const select = document.getElementById(id);
            select.innerHTML = '<option value="">Chargement...</option>';
            try {
                const res = await fetch(url);
                const data = await res.json();
                select.innerHTML = '<option value="">-- Choisir --</option>';
                data.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = labelFn(item);
                    select.appendChild(opt);
                });
            } catch (e) {
                select.innerHTML = '<option value="">Erreur</option>';
            }
        }
        fillSelect('id_prof', '/getListProfs', p => (p.nom || 'Prof') + ' ' + (p.prenom || ''));
        fillSelect('id_salle', '/salles/getListSalles', s => s.nom_salle || ('Salle ' + s.id));
        fillSelect('id_promo', '/promotions/getListPromotions', p => p.nom_promotion || ('Promo ' + p.id));

        // Petite fonction pour gérer les ID optionnels (renvoie null au lieu de NaN si vide)
        const parseOptionalInt = (value) => {
            const parsed = parseInt(value, 10);
            return isNaN(parsed) ? null : parsed;
        };

        const form = document.getElementById('createForm');
        const result = document.getElementById('result');
        const listCours = document.getElementById('list-cours');

        function computeDurationMinutes(startStr, endStr) {
            if (!startStr || !endStr) return null;
            const s = new Date(startStr);
            const e = new Date(endStr);
            if (isNaN(s) || isNaN(e)) return null;
            const diffMs = e - s;
            if (diffMs <= 0) return null;
            return Math.round(diffMs / 60000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            result.textContent = 'Envoi en cours...';
            const dateDebutVal = document.getElementById('date_debut').value;
            const dateFinVal = document.getElementById('date_fin').value;
            const dureeMinutes = computeDurationMinutes(dateDebutVal, dateFinVal);
            if (dureeMinutes === null) {
                result.textContent = 'Erreur: vérifiez les dates (la date de fin doit être après la date de début).';
                return;
            }
            document.getElementById('duree_total').value = String(dureeMinutes);
            const payload = {
                matiere: document.getElementById('matiere').value,
                date_debut: dateDebutVal,
                date_fin: dateFinVal,
                duree_total: String(dureeMinutes),
                id_prof: parseOptionalInt(document.getElementById('id_prof').value),
                id_salle: parseOptionalInt(document.getElementById('id_salle').value),
                id_promo: parseOptionalInt(document.getElementById('id_promo').value)
            };
            try {
                const res = await fetch(API + '/cours/addCours', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                if (!res.ok) throw new Error(JSON.stringify(json));
                result.textContent = 'Succès : ' + JSON.stringify(json, null, 2);
                form.reset();
                loadList();
            } catch (err) {
                result.textContent = 'Erreur: ' + err.message;
            }
        });

        async function loadList() {
            listCours.innerHTML = 'Chargement...';
            try {
                const r = await fetch(API + '/cours/getListCours');
                const j = await r.json();
                if (!j.length) {
                    listCours.innerHTML = '<em>Aucun cours enregistré.</em>';
                    return;
                }
                listCours.innerHTML = j.map(c => `<div class='cours-card'><strong>${c.matiere}</strong> | ${c.date_debut.slice(0,16).replace('T',' ')} - ${c.date_fin.slice(11,16)}<br>Prof: ${c.id_prof || '-'} | Salle: ${c.id_salle || '-'} | Promo: ${c.id_promo || '-'}</div>`).join('');
            } catch (e) {
                listCours.innerHTML = 'Erreur chargement liste.';
            }
        }
        loadList();
    </script>
</body>
</html>
